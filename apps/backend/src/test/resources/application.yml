spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/xqt_saas}
    username: ${SPRING_DATASOURCE_USERNAME:xqt}
    password: ${SPRING_DATASOURCE_PASSWORD:xqt_dev_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  auth:
    jwt-secret: ${JWT_SECRET:test-secret-key-for-unit-tests-only-not-production}
    token-ttl-seconds: 28800
