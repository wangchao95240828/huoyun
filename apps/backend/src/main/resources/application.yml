server:
  port: ${API_PORT:8080}

spring:
  application:
    name: xqt-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  sql:
    init:
      mode: never

debug: ${DEBUG:false}

logging:
  level:
    root: INFO
    org.springframework.boot.autoconfigure: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    token-ttl-seconds: ${AUTH_TOKEN_TTL_SECONDS:28800}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
