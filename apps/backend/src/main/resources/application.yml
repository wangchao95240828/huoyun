server:
  port: ${API_PORT:8080}

spring:
  application:
    name: xqt-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/xqt_saas}
    username: ${SPRING_DATASOURCE_USERNAME:xqt}
    password: ${SPRING_DATASOURCE_PASSWORD:xqt_dev_password}
    hikari:
      connection-test-query: select 1
      validation-timeout: 3000
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
      keepalive-time: 0
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  sql:
    init:
      mode: never

debug: ${DEBUG:false}

logging:
  level:
    root: INFO
    org.springframework.boot.autoconfigure: WARN
    com.xqt.saas.finance.mapper: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.transaction: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: xqt-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  prometheus:
    metrics:
      export:
        enabled: true

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    token-ttl-seconds: ${AUTH_TOKEN_TTL_SECONDS:28800}
  rates:
    # 生产应设为 true：报价失败（无价表/规则不全）时直接阻断 Submit，
    # 不允许退化为简化估算 estimatePrepayAmount。dev/demo 可设 false 以便联调。
    strict-quote: ${RATES_STRICT_QUOTE:false}
  carrier:
    # 生产应设为 true：渠道必须经 acc_channel_accounts 显式配置 provider，
    # 禁止 Demo/Noop 兜底取号。dev/demo 可设 false。
    strict-gateway: ${CARRIER_STRICT_GATEWAY:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.xqt.saas.finance.entity
  type-handlers-package: com.xqt.saas.finance.handler
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl