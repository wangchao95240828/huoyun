server:
  port: ${API_PORT:8888}

spring:
  application:
    name: xqt-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/xqt_saas}
    username: ${SPRING_DATASOURCE_USERNAME:xqt}
    password: ${SPRING_DATASOURCE_PASSWORD:38a1ba65af3599208b327625cec5279c698f}
  data:
    redis:
      host: ${REDIS_HOST:8.148.227.76}
      port: ${REDIS_PORT:6379}
  sql:
    init:
      mode: never

debug: false

logging:
  level:
    root: INFO
    org.springframework.boot.autoconfigure: WARN
    com.xqt.saas.finance.mapper: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  auth:
    jwt-secret: ${JWT_SECRET:replace-me-in-real-env}
    token-ttl-seconds: ${AUTH_TOKEN_TTL_SECONDS:28800}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.xqt.saas.finance.entity
  type-handlers-package: com.xqt.saas.finance.handler
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
