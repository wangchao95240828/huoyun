server:
  port: ${API_PORT:8080}

spring:
  application:
    name: xqt-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/xqt_saas}
    username: ${SPRING_DATASOURCE_USERNAME:xqt}
    password: ${SPRING_DATASOURCE_PASSWORD:xqt_dev_password}
    hikari:
      connection-test-query: select 1
      validation-timeout: 3000
      connection-timeout: 10000
      idle-timeout: 60000
      max-lifetime: 300000
      keepalive-time: 60000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  sql:
    init:
      mode: never

debug: ${DEBUG:false}

logging:
  level:
    root: INFO
    org.springframework.boot.autoconfigure: WARN
    com.xqt.saas.finance.mapper: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.transaction: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    token-ttl-seconds: ${AUTH_TOKEN_TTL_SECONDS:28800}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.xqt.saas.finance.entity
  type-handlers-package: com.xqt.saas.finance.handler
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl