<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 360 浏览器强制极速模式（避免落到 IE 内核白屏） -->
  <meta name="renderer" content="webkit" />
  <!-- IE/Edge 强制最新内核 -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <title>新航线统一平台</title>
  <style>
    #legacy-browser-warn{
      display:none;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;
      max-width:560px;margin:60px auto;padding:24px;border:1px solid #f1c40f;
      background:#fffbeb;border-radius:8px;color:#333;line-height:1.6;
    }
    #legacy-browser-warn h2{margin:0 0 12px;font-size:18px;color:#b8860b;}
    #legacy-browser-warn code{background:#f4f4f5;padding:2px 6px;border-radius:3px;}
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- 现代浏览器走 ES module -->
  <script type="module" src="/src/main.ts"></script>

  <!-- 不支持 ES module 的老浏览器（IE / 老 360 兼容模式 / 老微信 X5 / 老 UC）会执行这段 -->
  <script nomodule>
    document.getElementById('legacy-browser-warn').style.display = 'block';
  </script>

  <noscript>
    <div style="font-family:system-ui;max-width:560px;margin:60px auto;padding:24px;border:1px solid #f1c40f;background:#fffbeb;border-radius:8px;">
      <h2 style="margin:0 0 12px;color:#b8860b;">JavaScript 已被禁用</h2>
      请在浏览器设置里启用 JavaScript 后刷新页面。
    </div>
  </noscript>

  <div id="legacy-browser-warn">
    <h2>当前浏览器版本过低，无法打开新航线平台</h2>
    <p>请用以下浏览器之一打开本系统：</p>
    <ul>
      <li><b>Chrome / Edge</b> ≥ 94（推荐）</li>
      <li><b>Safari</b> ≥ 15（macOS / iOS）</li>
      <li><b>Firefox</b> ≥ 93</li>
      <li><b>360 极速浏览器</b>：地址栏右侧点闪电图标切到 <b>极速模式</b>（不要用兼容模式）</li>
    </ul>
    <p style="color:#888;font-size:13px;margin-top:16px;">
      如已是上述浏览器仍看到此页，请清缓存重试，或联系系统管理员。
    </p>
  </div>
</body>
</html>
