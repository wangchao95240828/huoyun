services:
  postgres:
    image: postgres:16-alpine
    container_name: xqt-postgres
    environment:
      POSTGRES_DB: xqt_saas
      POSTGRES_USER: xqt
      POSTGRES_PASSWORD: xqt_dev_password
      TZ: Asia/Hong_Kong
    ports:
      - "15432:5432"
    volumes:
      - xqt_pg_data:/var/lib/postgresql/data
      - ../db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ../db/migrations/002_rls.sql:/docker-entrypoint-initdb.d/002_rls.sql:ro
      - ../db/migrations/003_ledger.sql:/docker-entrypoint-initdb.d/003_ledger.sql:ro
      - ../db/migrations/004_jobs_idempotency.sql:/docker-entrypoint-initdb.d/004_jobs_idempotency.sql:ro
      - ../db/migrations/005_authorization.sql:/docker-entrypoint-initdb.d/005_authorization.sql:ro
      - ../db/migrations/006_full_painpoint_modules.sql:/docker-entrypoint-initdb.d/006_full_painpoint_modules.sql:ro
      - ../db/migrations/007_organizations_and_extensions.sql:/docker-entrypoint-initdb.d/007_organizations_and_extensions.sql:ro
      - ../db/migrations/008_main_master_data.sql:/docker-entrypoint-initdb.d/008_main_master_data.sql:ro
      - ../db/migrations/009_orders_warehouse.sql:/docker-entrypoint-initdb.d/009_orders_warehouse.sql:ro
      - ../db/migrations/010_finance_clone_core.sql:/docker-entrypoint-initdb.d/010_finance_clone_core.sql:ro
      - ../db/migrations/011_external_mapping.sql:/docker-entrypoint-initdb.d/011_external_mapping.sql:ro
      - ../db/migrations/012_auth_foundation.sql:/docker-entrypoint-initdb.d/012_auth_foundation.sql:ro
      - ../db/migrations/013_greenfield_two_flows.sql:/docker-entrypoint-initdb.d/013_greenfield_two_flows.sql:ro
      - ../db/migrations/014_common_saas_foundation.sql:/docker-entrypoint-initdb.d/014_common_saas_foundation.sql:ro
      - ../db/migrations/015_drop_sys_proto_tables.sql:/docker-entrypoint-initdb.d/015_drop_sys_proto_tables.sql:ro
      - ../db/migrations/016_acc_customerapi_seed.sql:/docker-entrypoint-initdb.d/016_acc_customerapi_seed.sql:ro
      - ../db/migrations/017_acc_rates_seed.sql:/docker-entrypoint-initdb.d/017_acc_rates_seed.sql:ro
      - ../db/migrations/018_finance_core.sql:/docker-entrypoint-initdb.d/018_finance_core.sql:ro
      - ../db/migrations/019_acc_labels_schema.sql:/docker-entrypoint-initdb.d/019_acc_labels_schema.sql:ro
      - ../db/migrations/020_acc_stowage_schema.sql:/docker-entrypoint-initdb.d/020_acc_stowage_schema.sql:ro
      - ../db/migrations/021_acc_audit_framework.sql:/docker-entrypoint-initdb.d/021_acc_audit_framework.sql:ro
      - ../db/migrations/022_acc_master_data_dicts.sql:/docker-entrypoint-initdb.d/022_acc_master_data_dicts.sql:ro
      - ../db/migrations/023_acc_exceptions_and_finance.sql:/docker-entrypoint-initdb.d/023_acc_exceptions_and_finance.sql:ro
      - ../db/migrations/024_acc_finance_txns_and_dicts.sql:/docker-entrypoint-initdb.d/024_acc_finance_txns_and_dicts.sql:ro
      - ../db/migrations/025_acc_finance_mgmt.sql:/docker-entrypoint-initdb.d/025_acc_finance_mgmt.sql:ro
      - ../db/seeds/001_seed.sql:/docker-entrypoint-initdb.d/101_seed.sql:ro
      - ../db/seeds/002_ledger_seed.sql:/docker-entrypoint-initdb.d/102_ledger_seed.sql:ro
      - ../db/seeds/003_auth_seed.sql:/docker-entrypoint-initdb.d/103_auth_seed.sql:ro
      - ../db/seeds/004_full_modules_seed.sql:/docker-entrypoint-initdb.d/104_full_modules_seed.sql:ro
      - ../db/seeds/005_org_seed.sql:/docker-entrypoint-initdb.d/105_org_seed.sql:ro
      - ../db/seeds/006_auth_seed.sql:/docker-entrypoint-initdb.d/106_auth_seed.sql:ro
      - ../db/seeds/007_external_seed.sql:/docker-entrypoint-initdb.d/107_external_seed.sql:ro
      - ../db/seeds/008_demo_flow_seed.sql:/docker-entrypoint-initdb.d/108_demo_flow_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xqt -d xqt_saas"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: xqt-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - xqt_redis_data:/data

volumes:
  xqt_pg_data:
  xqt_redis_data:
