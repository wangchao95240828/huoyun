# Prometheus 配置 — 抓 xqt-backend
# 部署: scp prometheus.yml root@8.148.227.76:/etc/prometheus/prometheus.yml
#       docker run -d --name prometheus --network host \
#         -v /etc/prometheus:/etc/prometheus \
#         -v /var/lib/prometheus:/prometheus \
#         prom/prometheus:latest \
#         --config.file=/etc/prometheus/prometheus.yml \
#         --storage.tsdb.path=/prometheus

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: xqt-saas-prod

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: xqt-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 127.0.0.1:18103
        labels:
          service: backend
          env: prod

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093
