name: CD (auto-deploy to production)

# 在 GitHub 托管 Ubuntu Runner 上跑（CentOS 7 EOL 无法装自托管 runner）
# 触发：push 到指定分支（默认 feat/acc-full-migration-2026-05-26；future main）
# 作用：在 GitHub 编译 → SSH 跑 migration → SCP jar+dist 到服务器 → 远程重启 → 健康检查 → 失败自动回滚

on:
  push:
    branches:
      - feat/acc-full-migration-2026-05-26
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: '跳过单元测试'
        type: boolean
        default: false
      skip_migration:
        description: '跳过 DB migration'
        type: boolean
        default: false

# 串行：同一时刻只能有一个 CD 在跑
# (v2 后缀是为了绕开一个永远卡在 queued 的 orphan run — 不影响功能)
concurrency:
  group: cd-production-v2
  cancel-in-progress: false

env:
  SERVER_HOST: 8.148.227.76
  SERVER_USER: root
  BACKEND_JAR: /opt/xqt-saas/backend/xqt-backend.jar
  BACKEND_JAR_BAK: /opt/xqt-saas/backend/xqt-backend.jar.bak
  WEB_ROOT: /opt/xqt-saas/web
  WEB_ROOT_BAK: /opt/xqt-saas/web.bak
  HEALTH_URL: http://127.0.0.1:18103/actuator/health
  # 远程跑 psql 用的 DB 密码（也可以改为 secrets.DB_PASSWORD）
  DB_HOST: 127.0.0.1
  DB_PORT: 15432
  DB_USER: xqt
  DB_NAME: xqt_saas

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Show commit
        run: |
          echo "Commit: $(git log -1 --pretty=format:'%h %s (%an, %ar)')"
          echo "Branch: ${GITHUB_REF_NAME}"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # ─── 编译阶段 ───
      - name: Build backend
        working-directory: apps/backend
        run: |
          if [[ "${{ inputs.skip_tests }}" == "true" ]]; then
            echo "▶ skipTests=true"
            ./mvnw -q -B -DskipTests package
          else
            ./mvnw -q -B package
          fi
          test -f target/xqt-backend-0.0.1-SNAPSHOT.jar
          ls -lh target/xqt-backend-0.0.1-SNAPSHOT.jar

      - name: Build web
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          ls -lh dist/

      # ─── SSH 准备 ───
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # 验证连通
          ssh -i ~/.ssh/id_ed25519 "$SERVER_USER@$SERVER_HOST" 'echo "✓ SSH OK from $(hostname)"'

      # ─── DB Migration（在服务器上跑 psql） ───
      - name: Run DB migrations
        if: inputs.skip_migration != true
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          # 把 db/migrations 整个目录 rsync 到服务器
          rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519" \
            db/migrations/ "$SERVER_USER@$SERVER_HOST:/tmp/cd-migrations/"

          # 远程跑：建追踪表 + 逐个跑没跑过的 migration
          ssh -i ~/.ssh/id_ed25519 "$SERVER_USER@$SERVER_HOST" bash << EOF
          set -e
          export PGPASSWORD='$DB_PASSWORD'
          PSQL="psql -h $DB_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME"

          # 追踪表（幂等）
          \$PSQL -c "CREATE TABLE IF NOT EXISTS schema_migrations (
            filename text PRIMARY KEY,
            applied_at timestamptz NOT NULL DEFAULT now()
          )" >/dev/null

          # 逐个跑
          for f in /tmp/cd-migrations/*.sql; do
            [ -f "\$f" ] || continue
            base=\$(basename "\$f")
            applied=\$(\$PSQL -tA -c "SELECT 1 FROM schema_migrations WHERE filename='\$base'")
            if [ "\$applied" = "1" ]; then
              echo "  ✓ already applied: \$base"
              continue
            fi
            echo "  ▶ applying: \$base"
            \$PSQL -v ON_ERROR_STOP=1 -f "\$f"
            \$PSQL -c "INSERT INTO schema_migrations(filename) VALUES('\$base')" >/dev/null
            echo "  ✓ done: \$base"
          done
          rm -rf /tmp/cd-migrations
          EOF

      # ─── 部署 backend ───
      - name: Deploy backend jar
        run: |
          # 1. 远程备份当前 jar
          ssh -i ~/.ssh/id_ed25519 "$SERVER_USER@$SERVER_HOST" \
            "cp '$BACKEND_JAR' '$BACKEND_JAR_BAK' 2>/dev/null || true"

          # 2. scp 新 jar（用 rsync --inplace 防 scp 截断 80MB→53MB 的旧 bug）
          rsync -avz --inplace --partial -e "ssh -i ~/.ssh/id_ed25519" \
            apps/backend/target/xqt-backend-0.0.1-SNAPSHOT.jar \
            "$SERVER_USER@$SERVER_HOST:$BACKEND_JAR"

          # 3. 远程 restart + 健康检查
          ssh -i ~/.ssh/id_ed25519 "$SERVER_USER@$SERVER_HOST" bash << 'EOF'
          set -e
          systemctl restart xqt-backend
          echo "▶ waiting health UP (max 60s)"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18103/actuator/health 2>/dev/null | grep -q UP; then
              echo "  ✓ healthy (${i}x2s = $((i*2))s)"
              exit 0
            fi
            sleep 2
          done
          echo "✗ backend not healthy after 60s"
          exit 1
          EOF

      # ─── 部署 backend 失败 → 自动回滚 ───
      - name: Rollback backend on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/id_ed25519 "$SERVER_USER@$SERVER_HOST" bash << EOF
          if [ -f '$BACKEND_JAR_BAK' ]; then
            echo "✗ deploy failed — rolling back jar from .bak"
            cp '$BACKEND_JAR_BAK' '$BACKEND_JAR'
            systemctl restart xqt-backend
            echo "  ✓ rolled back"
          else
            echo "✗ no .bak to roll back to"
          fi
          EOF

      # ─── 部署 web ───
      - name: Deploy web dist
        run: |
          # rsync 整个 dist → 服务器 web 根
          # --delete 防止旧 hash bundle 无限堆积（备份过 dist 进 .bak 防误删）
          ssh -i ~/.ssh/id_ed25519 "$SERVER_USER@$SERVER_HOST" \
            "rm -rf '$WEB_ROOT_BAK' 2>/dev/null; cp -r '$WEB_ROOT' '$WEB_ROOT_BAK'"

          rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519" \
            apps/web/dist/ "$SERVER_USER@$SERVER_HOST:$WEB_ROOT/"

      # ─── 公网回放验证 ───
      - name: Verify public access
        run: |
          EXPECTED=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' apps/web/dist/index.html | head -1)
          for i in 1 2 3 4 5; do
            ACTUAL=$(curl -sfL "http://$SERVER_HOST/?cache_bust=$(date +%s)$i" \
              | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1)
            if [ "$EXPECTED" = "$ACTUAL" ]; then
              echo "✓ public serves new bundle: $ACTUAL"
              exit 0
            fi
            echo "  attempt $i: expected $EXPECTED, got $ACTUAL — retry in 3s"
            sleep 3
          done
          echo "✗ public still serving old bundle after 5 attempts"
          exit 1

      - name: Final health summary
        if: always()
        run: |
          echo "::notice title=Deploy Summary::Branch=${{ github.ref_name }} Commit=${{ github.sha }}"
          ssh -i ~/.ssh/id_ed25519 "$SERVER_USER@$SERVER_HOST" \
            "curl -s $HEALTH_URL || true; echo; md5sum $BACKEND_JAR; ls -la $WEB_ROOT/index.html"
