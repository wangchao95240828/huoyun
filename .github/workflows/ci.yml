name: CI

# 跑在 GitHub 托管 Ubuntu Runner（免费，自动维护）
# 触发：任何 push + PR
# 作用：编译 + 单元测试 + 前端 build → 防止挂掉的代码被合进来

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Backend compile
        working-directory: apps/backend
        run: ./mvnw -q -B -DskipTests compile

      - name: Backend test
        working-directory: apps/backend
        run: ./mvnw -B test
        continue-on-error: false

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: apps/backend/target/surefire-reports/
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm workspaces: lockfile + 命令都在仓库根
      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke check bundle
        run: |
          test -f apps/web/dist/index.html || exit 1
          ls apps/web/dist/assets/main-*.js > /dev/null || exit 1
          echo "✓ dist/index.html + assets generated"
